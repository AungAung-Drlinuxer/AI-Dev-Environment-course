# ဤဖိုင် ပုံသည် OPTIONAL ဖြစ်သည် — module 07 (Docker for AI) တွင် ဖော်ပြထားသည့်
# multi-service stack ကို ဒေသအတွင်း လေ့ကျင့်ရန် အသုံးပြုသည်။ course ၏ lab များသည် ဤဖိုင် မလိုဘဲ run နိုင်သည်။
#
# အသုံးပြုနည်း:
#   docker compose up -d qdrant
#   docker compose run --rm ai-dev python -c "import torch; print(torch.__version__)"
#
# GPU လိုအပ်သည့် service များအတွက် host တွင် NVIDIA Container Toolkit လိုအပ်သည်။
# image tag များသည် အချိန်နှင့်အမျှ ပြောင်းလဲသည် — run မီ မိမိ driver/CUDA version နှင့် ကိုက်ညီကြောင်း စစ်ပါ။

services:
  qdrant:
    # Source lesson 07 pins `qdrant/qdrant:v1.12.5`; ဤဖိုင်တွင် `latest` ကို သုံးထားသည်။
    # module 07 ၏ exercise 4 သည် tag နှစ်မျိုး၏ ကွာခြားချက်ကို နှိုင်းယှဉ်ပြသည် — run မီ tag ကို စစ်ပါ။
    image: qdrant/qdrant:latest
    container_name: aidev-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-dev:
    build:
      context: .
      dockerfile: modules/07_docker_for_ai/Dockerfile.example
    container_name: aidev-app
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - aidev_cache:/root/.cache
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "-c", "print('ai-dev container ready')"]

volumes:
  qdrant_storage:
  aidev_cache:
